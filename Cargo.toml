[package]
name = "geyserbench"
version = "1.2.3"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
bs58 = "0.5"
bytes = "1"
comfy-table = "7"
crossbeam-queue = "0.3"
dashmap = "6"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
lazy_static = "1"
prost = "0.14"
prost-types = "0.14"
serde = "1"
serde_json = "1"
solana-entry = { version = "4", features = ["agave-unstable-api"] }
solana-pubkey = "4"
thiserror = "2"
thorstreamer-grpc-client = "0.1.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wincode = "0.5"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
